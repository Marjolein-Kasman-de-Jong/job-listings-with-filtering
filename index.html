<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Listings With Filtering</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/styles/style.css">

    <link rel="shortcut icon" href="./assets/images/favicon-32x32.png" type="image/x-icon">
</head>

<body>
    <header class="page-header">
        <h1 class="visibility-hidden">
            Job listings
        </h1>
    </header>
    <main>
        <section class="filters text-preset-3-bold hidden">
            <h2 class="visibility-hidden">Jobs filter</h2>
            <ul id="filter-list" class="filter-list">
            </ul>
            <button id="clear-btn" class="clear-btn">Clear</button>
        </section>
        <section class="jobs">
            <h2 class="visibility-hidden">Jobs list</h2>
            <div id="jobs-list" class="jobs-list">
            </div>
        </section>
    </main>
    <template id="job-card-template">
        <div class="job-card">
            <img class="job-card-logo" src="" alt="">
            <div class="job-card-content">
                <div class="job-card-eyebrow">
                    <p class="job-card-company"></p>
                </div>
                <h3 class="job-card-title">
                    <a href="#"></a>
                </h3>
                <ul class="job-card-meta"></ul>
            </div>
            <ul class="job-card-tags"></ul>
        </div>
    </template>
    <script src="./assets/scripts/main.js"></script>
</body>

</html>
